name: Basic website checks
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  site_name: bia-beta-website # remainder added by netlify

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: PLAYWRIGHT_BROWSERS_PATH=artifacts/browsers npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.3
      - run: helm lint --strict helm-chart --set image.tag=verification
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: website-verification
          path: |
            artifacts/website-verification/report.json
            artifacts/browser-results/
            artifacts/testing/astro/**/build-*.json
            artifacts/testing/astro/**/build-*.log
            artifacts/website-verification/application/artifacts/deployment/
          retention-days: 7
          if-no-files-found: ignore

  live-catalogue:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:deployment
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: catalogue-snapshot
          path: |
            artifacts/catalogue/
            artifacts/deployment/
          retention-days: 7

  wait-for-deploy:
    if: github.event_name == 'pull_request' && github.repository == 'BioImage-Archive/BIA-astro'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Waiting for 200 from the Netlify Preview
        uses: jakepartusch/wait-for-netlify-action@f1e137043864b9ab9034ae3a5adc1c108e3f1a48 # v1.4
        with:
          site_name: ${{ env.site_name }}
          max_timeout: 1200
          base_path: /bioimage-archive/

  link-check:
    needs: wait-for-deploy
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/linkchecker/linkchecker@sha256:56cdc2cb7b10ef785f643c67707a3ac573c8d70cb11cd17000a1e8a185009ac0
    steps:
      - run: |
          # no-warnings because linkchecker runs as root in container -> warning emitted -> nonzero return code -> job fails
          linkchecker https://deploy-preview-${{ github.event.number }}--${{ env.site_name }}.netlify.app/bioimage-archive/ -o failures \
            --no-warnings \
            --ignore-url '.*\/vis\/?.*' \
            --ignore-url '.*\/dataset\/?.*' \
            --ignore-url '.*\/sodataset\/?.*' \
            --ignore-url '.*\/aidataset\/?.*'
