name: Basic website checks
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  site_name: bia-beta-website # remainder added by netlify

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  wait-for-deploy:
    if: github.repository == 'BioImage-Archive/BIA-astro'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Waiting for 200 from the Netlify Preview
        uses: jakepartusch/wait-for-netlify-action@f1e137043864b9ab9034ae3a5adc1c108e3f1a48 # v1.4
        with:
          site_name: ${{ env.site_name }}
          max_timeout: 1200
          base_path: /bioimage-archive/

  link-check:
    needs: wait-for-deploy
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/linkchecker/linkchecker@sha256:56cdc2cb7b10ef785f643c67707a3ac573c8d70cb11cd17000a1e8a185009ac0
    steps:
      - run: |
          # no-warnings because linkchecker runs as root in container -> warning emitted -> nonzero return code -> job fails
          linkchecker https://deploy-preview-${{ github.event.number }}--${{ env.site_name }}.netlify.app/bioimage-archive/ -o failures \
            --no-warnings \
            --ignore-url '.*\/vis\/?.*' \
            --ignore-url '.*\/dataset\/?.*' \
            --ignore-url '.*\/sodataset\/?.*' \
            --ignore-url '.*\/aidataset\/?.*'
